name: Update CRAN Archive

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Rebuild from scratch, ignoring the prior manifest."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cran-archive-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RSQLite
            any::DBI
            any::jsonlite
            any::testthat
            any::withr
            any::digest
      - name: Run unit tests
        run: Rscript tests/testthat.R
      - name: Build archive database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            Rscript scripts/update.R out/ --bootstrap
          else
            Rscript scripts/update.R out/
          fi
      - name: Publish to the "current" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHANGED=$(jq -r '.changed' out/manifest.json)
          NAMES_HEALTHY=$(jq -r '.names_healthy' out/manifest.json)
          if ! gh release view current >/dev/null 2>&1; then
            git tag -f current
            git push -f origin current || true
            gh release create current --title "CRAN Archive (rolling)" --notes "Rolling record of CRAN packages removed from the live listing, with archival dates." --latest
            CHANGED=true
          fi
          # Publish on any healthy run (covers a newly-live-only package, which
          # never moves the archive fingerprint that CHANGED tracks) and skip
          # entirely when names_healthy is false: that means the prior
          # cran_names_all was unreachable this run, so out/cran-archive.db has
          # no names table and must not clobber the last known good release.
          if [ "$NAMES_HEALTHY" != "false" ]; then
            gh release upload current out/cran-archive.db --clobber
            gh release upload current out/manifest.json --clobber
          fi

  keepalive:
    # GitHub disables a public repository's scheduled workflows after 60 days
    # without repository activity. Publishing a release does not count and a
    # commit does, so this is its own job: a failed or timed-out update still
    # keeps the schedule alive.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # The work takes seconds; the rest is headroom for a slow runner start.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Update last run timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            # Decide against main as it is now, not the commit this run started
            # from, so a re-run, a queued run or a push that lands meanwhile
            # finds the newer commit and stops here instead of conflicting.
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            # A commit a day is far inside the 60-day window, so skip when main
            # already has a commit from the last 20 hours.
            if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 72000 ]; then
              echo "main already has a commit from the last 20 hours"
              exit 0
            fi
            echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last-updated.txt
            git add last-updated.txt
            git commit -m "chore: update last run time"
            git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1

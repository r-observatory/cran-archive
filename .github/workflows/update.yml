name: Update CRAN Archive

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Rebuild from scratch, ignoring the prior manifest."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: cran-archive-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Hashing stops starting downloads a set time after this, however long
      # the setup steps took, so the publish step runs inside the timeout.
      - name: Record when the job started
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::RSQLite
            any::DBI
            any::jsonlite
            any::testthat
            any::withr
            any::digest
      - name: Run unit tests
        run: Rscript tests/testthat.R
      - name: Build archive database
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p out
          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            Rscript scripts/update.R out/ --bootstrap
          else
            Rscript scripts/update.R out/
          fi
      - name: Publish to the "current" release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CHANGED=$(jq -r '.changed' out/manifest.json)
          NAMES_HEALTHY=$(jq -r '.names_healthy' out/manifest.json)
          TARBALLS_STATE=$(jq -r '.tarballs_state' out/manifest.json)
          if ! gh release view current >/dev/null 2>&1; then
            git tag -f current
            git push -f origin current || true
            gh release create current --title "CRAN Archive (rolling)" --notes "Rolling record of CRAN packages removed from the live listing, with archival dates." --latest
            CHANGED=true
          fi
          # Publish on any healthy run (covers a newly-live-only package, which
          # never moves the archive fingerprint that CHANGED tracks) and skip
          # entirely when names_healthy is false: that means the prior
          # cran_names_all was unreachable this run, so out/cran-archive.db has
          # no names table and must not clobber the last known good release.
          # The same holds when the prior cran_tarballs could not be read.
          if [ "$NAMES_HEALTHY" != "false" ] && [ "$TARBALLS_STATE" != "unreachable" ]; then
            gh release upload current out/cran-archive.db --clobber
            gh release upload current out/manifest.json --clobber
          fi
      - name: Check the tarball record
        run: |
          STATE=$(jq -r '.tarballs_state' out/manifest.json)
          echo "cran_tarballs: $STATE, $(jq -r '.n_tarballs' out/manifest.json) rows, $(jq -r '.tarball_revisions_new' out/manifest.json) new files"
          HASH_STOP=$(jq -r '.tarball_hash_stop' out/manifest.json)
          MISMATCHES=$(jq -r '.tarball_hash_mismatches // 0' out/manifest.json)
          FAILURES=$(jq -r '.tarball_hash_failures // 0' out/manifest.json)
          echo "cran_tarballs hashes: $(jq -r '.tarballs_hashed' out/manifest.json) hashed this run, $(jq -r '.tarballs_to_hash' out/manifest.json) still to hash, $MISMATCHES mismatches, $FAILURES failed downloads (stopped: $HASH_STOP)"
          # A file that did not verify or download stored nothing and is tried
          # again next run; the run log names each one.
          if [ "$MISMATCHES" != "0" ] || [ "$FAILURES" != "0" ]; then
            echo "::warning::cran_tarballs: $MISMATCHES files did not match their record and $FAILURES failed to download"
          fi
          if [ "$HASH_STOP" = "error" ]; then
            echo "::error::cran_tarballs hashing stopped on an error; the run log has it"
            exit 1
          fi
          # Any other state left the table as it was or unpublished.
          case "$STATE" in
            cold_start|updated) ;;
            *) echo "::error::cran_tarballs was not updated this run (state: $STATE)"; exit 1 ;;
          esac

  keepalive:
    # GitHub disables a public repository's scheduled workflows after 60 days
    # without repository activity. Publishing a release does not count and a
    # commit does, so this is its own job: a failed or timed-out update still
    # keeps the schedule alive.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    # The work takes seconds; the rest is headroom for a slow runner start.
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Update last run timestamp
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for _ in 1 2 3; do
            # Decide against main as it is now, not the commit this run started
            # from, so a re-run, a queued run or a push that lands meanwhile
            # finds the newer commit and stops here instead of conflicting.
            git fetch --depth=1 origin main
            git reset --hard FETCH_HEAD
            # A commit a day is far inside the 60-day window, so skip when main
            # already has a commit from the last 20 hours.
            if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -lt 72000 ]; then
              echo "main already has a commit from the last 20 hours"
              exit 0
            fi
            echo "Last updated: $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > last-updated.txt
            git add last-updated.txt
            git commit -m "chore: update last run time"
            git push origin HEAD:main && exit 0
            sleep 10
          done
          exit 1
